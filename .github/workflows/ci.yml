name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Regenerate observations first so the tests check this commit's outputs.
      - run: npm run eval -- --mode offline
      - run: npm test
      - run: npm run build
