services:
  - type: web
    name: refunddesk
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: AI_MODE
        value: offline
      # Hosted key-free replay demo (in-memory snapshot; no disk needed).
      # Owner authentication is still required.
      - key: DEMO_MODE
        value: "replay"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
